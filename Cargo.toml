[package]
name = "shardy"
version = "0.1.4"
edition = "2024"

[dependencies]
chacha20poly1305 = "0.10.1"
clap = { version = "4.6.0", features = ["derive"] }
crypto-bigint = {version = "0.7.1", features = ["zeroize"]}
crypto-common = "0.1.7"
rand = "0.10.0"
regex = "1.12.3"
shardlib = "0.2.0"
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }
